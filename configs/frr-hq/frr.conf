frr defaults traditional
hostname HQ-R
log stdout
service integrated-vtysh-config
!
ip route 0.0.0.0/0 10.255.0.2
!
router ospf
 ospf router-id 1.1.1.1
 network 10.10.10.0/24 area 0
 network 10.10.20.0/24 area 0
 network 10.10.30.0/24 area 0
 network 10.10.40.0/24 area 0
 network 10.255.1.0/30 area 0
 passive-interface eth0.10
 passive-interface eth0.20
 passive-interface eth0.30
 passive-interface eth0.40
 default-information originate always
!
